name: detran_transform
version: 1.0.0
config-version: 2

profile: detran

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

models:
  detran_transform:
    staging:
      +materialized: view
      +schema: staging
    mart:
      +materialized: table
      +schema: mart_dbt

seeds:
  detran_transform:
    +schema: staging

vars:
  # Aceitos no portal (parse_editais)
  edital_status_values: ["Publicado", "Finalizado", "Em Andamento"]

on-run-end:
  - "CREATE UNIQUE INDEX IF NOT EXISTS uq_mart_dbt_mart_lotes_lote_id ON mart_dbt.mart_lotes (lote_id)"
  - "CREATE UNIQUE INDEX IF NOT EXISTS uq_mart_dbt_mart_editais_leilao_id ON mart_dbt.mart_editais (leilao_id)"
