services:
  postgres:
    image: postgres:16-alpine
    container_name: detran_leiloes_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: detran_leiloes
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d detran_leiloes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
